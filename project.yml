name: NetMeter
options:
  bundleIdPrefix: com.sudhirkumar
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
targets:
  NetMeterCore:
    type: framework
    platform: macOS
    sources:
      - Sources/NetMeterCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sudhirkumar.NetMeterCore
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
  NetMeter:
    type: application
    platform: macOS
    sources:
      - Sources/NetMeterApp
      - Resources/Assets.xcassets
    dependencies:
      - target: NetMeterCore
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sudhirkumar.NetMeter
        INFOPLIST_FILE: Packaging/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: NetMeter
  NetMeterCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/NetMeterCoreTests
    dependencies:
      - target: NetMeterCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sudhirkumar.NetMeterCoreTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NetMeter:
    build:
      targets:
        NetMeter: all
        NetMeterCoreTests: [test]
    test:
      targets:
        - NetMeterCoreTests
